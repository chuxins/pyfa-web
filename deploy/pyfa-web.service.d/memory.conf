[Service]
# 内存上限，防止单服务拖垮整机（2026-10-01 OOM 事故后添加）
#
# 2026-10-25 换机后调整：新机器 3.8 GB 内存，而**首次启动重建 eve.db**
# （staticdata 全量入 SQLite，约 60 s）的峰值超过 1.2 GB —— 旧值会让服务
# 在建库途中被 cgroup OOM 杀掉，systemd 的 Restart=always 于是把它拖进
# 「建库 → 被杀 → 重启」的死循环（新机上实测连挂 21 次，eve.db 永远停在 164 KB）。
# 现在留到 1.5 G 软线 / 2.6 G 硬线：平时占用约 150~300 MB，重建也够用，
# 整机仍留 1 GB 以上余量。
MemoryAccounting=true
MemoryHigh=1500M
MemoryMax=2600M
