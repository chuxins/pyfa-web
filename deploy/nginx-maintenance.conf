# pyfa-web 维护页（502 / 503 / 504）
#
# 后端挂了、重启中、或者更新脚本正在 rollout 时，nginx 会自己产生 502/504，
# 浏览器就只剩一行 "502 Bad Gateway"。
#
# 维护页本体是 web/frontend/public/maintenance.html，随前端构建复制到
# web/static/maintenance.html（所以它在仓库里，部署脚本的 git reset --hard 会带着它）。
# 它是纯静态页面（样式脚本全内联，不经过 Python），自己每 5 秒轮询 api/meta，
# 等服务回来就自动跳回装配页。
#
# 两个入口，先配哪个都能用：
#   1) 本文件的 error_page —— 后端一挂就顶上，覆盖所有人（推荐）；
#   2) 前端注册的 Service Worker（web/frontend/public/sw.js）—— 只对装过 SW 的
#      回访用户生效，但不需要动 nginx。两者可以同时存在，SW 只在网络失败时才用。
#
# 用法：把下面两段加进站点 server{} 块（子路径 /AssemblyPlanning 与域名根都能用，
# 只改 alias 后面的路径与 location/error_page 里的前缀）。

# ---------------------------------------------------------------------------
# 1) 错误页
# ---------------------------------------------------------------------------
# 只拦 nginx 自己产生的 502/504（上游连不上、超时），以及显式的 503。
# 故意不开 proxy_intercept_errors：那个会把上游返回的 404 也拐到维护页，
# SPA 的路由 404 和自己的 404 页面就都看不见了。
#
# =503：对外回 503 而不是 502，"暂时不可用、稍后重试" 的语义更准，
# 爬虫/监控也按临时故障处理（502 常被读成网关配错）。
error_page 502 503 504 =503 /AssemblyPlanning/maintenance.html;

# 让连不上的后端早点暴露成 502，而不是让用户干等默认的 60 秒
# （Python 冷启动 + 读取游戏数据的首屏请求本身可能偏慢，read_timeout 别调太小）
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 60s;

# ---------------------------------------------------------------------------
# 2) 维护页本体
# ---------------------------------------------------------------------------
# 直接指到仓库里的构建产物，不经过 Python 进程（它可能正挂着）。
location = /AssemblyPlanning/maintenance.html {
    alias /opt/pyfa-web/web/static/maintenance.html;
    default_type text/html;

    # 维护期间别让浏览器/中间层缓存这个页面，否则服务恢复了还在看维护页
    add_header Cache-Control "no-store" always;
    # 顺手告诉客户端 30 秒后再来
    add_header Retry-After 30 always;
}

# 域名根部署时改成：
#   error_page 502 503 504 =503 /maintenance.html;
#   location = /maintenance.html { alias /opt/pyfa-web/web/static/maintenance.html; ... }
#
# 想让人能直接打开维护页（排障、对外公告用），把上面的 location 原样保留即可，
# 它没有 `internal;`。只想让 error_page 内部跳转能到达，就加上 `internal;`。
#
# 验证（后端正常时也应能直接打开这一页）：
#   curl -sI https://eve-tools.xyz/AssemblyPlanning/maintenance.html | head -3
#   # 应看到 Cache-Control: no-store；如果返回的是 SPA 的 index.html（几十字节的
#   # <!doctype html> 且没有 no-store），说明本段还没生效或 alias 路径不对
