# pyfa-web 站点配置（参考版：服务器 /etc/nginx/sites-available/pyfa-web 的对应内容）
#
# 应用只听 127.0.0.1:8091，挂在 /AssemblyPlanning/ 子路径。前缀由**构建期**的 Vite base
# 补齐（web/static 里的 HTML/CSS/JS 都自带 /AssemblyPlanning/），所以这里只 strip 前缀，
# 不做任何 sub_filter 改写 —— 改写 JS 字符串既脆，又会让 ETag/304 与改写后的内容失配。
#
# 配套文件：/etc/nginx/snippets/pyfa-web-headers.conf（安全响应头，见本文件末尾注释）。
# 注意 nginx 的 add_header 继承规则：某个 location 里只要出现了自己的 add_header，
# 上层的 add_header 就**全部不继承**，所以下面带 add_header 的 location 都再 include 一次。
#
# 改完：nginx -t && systemctl reload nginx

server {
    server_name eve-tools.xyz;

    access_log /var/log/nginx/pyfa-web.access.log;
    error_log  /var/log/nginx/pyfa-web.error.log;

    # ---- 压缩 -------------------------------------------------------------
    # nginx.conf 里的 gzip on 只压 text/html；前端 bundle 有 300 KB 上下，必须补类型。
    # 应用自己也有 GZipMiddleware：双层不会压两遍，nginx 看到 Content-Encoding 就透传。
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # ---- 请求体上限 -------------------------------------------------------
    # 默认 1 MB：XML 备份恢复、批量导入大一点就 413。前端不传文件，16 MB 足够。
    client_max_body_size 16m;

    # ---- 安全响应头 -------------------------------------------------------
    include /etc/nginx/snippets/pyfa-web-headers.conf;

    # ---- 维护页（502/503/504）---------------------------------------------
    # 后端重启、rollout 期间上游连不上，nginx 会自己产生 502/504；换成静态维护页
    # （不经过 Python），页面自己轮询 api/meta，服务回来自动跳回装配页。
    # =503：对外回 503「暂时不可用」，比 502 语义准。
    # 故意不开 proxy_intercept_errors：那会把上游自己的 404 也拐到维护页。
    error_page 502 503 504 =503 /AssemblyPlanning/maintenance.html;

    # 连不上后端时 3 秒就暴露，而不是让用户干等默认的 60 秒
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;

    location = /AssemblyPlanning/maintenance.html {
        alias /opt/pyfa-web/web/static/maintenance.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 30 always;
        include /etc/nginx/snippets/pyfa-web-headers.conf;
    }

    location = / { return 302 /AssemblyPlanning/; }
    location = /AssemblyPlanning { return 301 /AssemblyPlanning/; }

    # ---- 带 hash 的前端资源：一年长缓存 -----------------------------------
    # 文件名里带构建 hash，内容变了文件名就变，所以可以 immutable 地缓存。
    # 这里只用 expires（不是 add_header），不会打断上层的安全头继承。
    location ^~ /AssemblyPlanning/assets/ {
        proxy_pass http://127.0.0.1:8091/assets/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1y;
    }

    # ---- 游戏图标 / 舰船渲染（/img/…）：本地静态文件，一年不变 ----------
    # 应用给的是 public, max-age=31536000, immutable；这里**不要**再加 expires 或
    # Cache-Control —— nginx 的 add_header/expires 会覆盖上游那个头，之前这些图片挂在
    # 下面的 SPA location 上，就被一起写成了 no-cache。
    location ^~ /AssemblyPlanning/img/ {
        proxy_pass http://127.0.0.1:8091/img/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/pyfa-web-headers.conf;
    }

    # ---- Service Worker：绝不能长缓存（它自己就是维护页兜底） -------------
    location = /AssemblyPlanning/sw.js {
        proxy_pass http://127.0.0.1:8091/sw.js;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pyfa-web-headers.conf;
    }

    # ---- API：strip 前缀、关闭缓冲（SSE）、超时拉长 -----------------------
    location ^~ /AssemblyPlanning/api/ {
        proxy_pass http://127.0.0.1:8091/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_redirect ~^/(AssemblyPlanning/)+(.*)$ /AssemblyPlanning/$2;
        proxy_redirect ~^/(?!AssemblyPlanning/)(.*)$ /AssemblyPlanning/$1;
    }

    # ---- SPA 与其它静态文件：strip 前缀即可，不缓存入口 HTML --------------
    location ^~ /AssemblyPlanning/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # index.html 不缓存：发布后刷新即得新 bundle（其余资源在 assets/ 里长缓存）
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/pyfa-web-headers.conf;
        proxy_redirect ~^/(AssemblyPlanning/)+(.*)$ /AssemblyPlanning/$2;
        proxy_redirect ~^/(?!AssemblyPlanning/)(.*)$ /AssemblyPlanning/$1;
    }

    # ---- TLS（certbot 管理；http2 是手工加的）-----------------------------
    listen [::]:443 ssl http2 ipv6only=on; # managed by Certbot
    listen 443 ssl http2;                  # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/eve-tools.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/eve-tools.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = eve-tools.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name eve-tools.xyz;
    return 404; # managed by Certbot
}

# ===========================================================================
# /etc/nginx/snippets/pyfa-web-headers.conf 的内容：
#
#   add_header X-Content-Type-Options "nosniff" always;
#   add_header X-Frame-Options "SAMEORIGIN" always;
#   add_header Referrer-Policy "same-origin" always;
#   add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
#   add_header Strict-Transport-Security "max-age=31536000" always;
#
# （HSTS 不加 includeSubDomains：这个域名下可能还有别的、不支持 https 的子域）
# ===========================================================================
